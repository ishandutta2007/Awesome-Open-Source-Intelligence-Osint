<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseCircle {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.6; }
      }
      @keyframes blinkTarget {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-10px); opacity: 0.8; }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.7; }
        50% { stroke-opacity: 1; }
      }

      .radar-sweep {
        transform-origin: 980px 210px;
        animation: radarSweep 6s linear infinite;
      }
      .radar-pulse {
        transform-origin: 980px 210px;
        animation: pulseCircle 4s ease-in-out infinite;
      }
      .target-1 {
        transform-origin: 920px 140px;
        animation: blinkTarget 2.5s ease-in-out infinite;
      }
      .target-2 {
        transform-origin: 1040px 270px;
        animation: blinkTarget 3.2s ease-in-out 0.8s infinite;
      }
      .target-3 {
        transform-origin: 960px 290px;
        animation: blinkTarget 1.8s ease-in-out 1.2s infinite;
      }
      .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 5s ease-in-out 1s infinite; }
      .particle-3 { animation: floatParticle 6s ease-in-out 2s infinite; }
      .card-border { animation: borderGlow 3s ease-in-out infinite; }

      .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect x="4" y="4" width="1192" height="412" rx="20" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern Background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />

    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
  </g>

  <!-- Glowing Constellation Nodes (Ambient) -->
  <g opacity="0.3">
    <line x1="80" y1="90" x2="190" y2="140" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="190" y1="140" x2="260" y2="80" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="580" y1="90" x2="650" y2="50" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="720" y1="330" x2="810" y2="380" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Dynamic Radar Scanner (Right-Hand Ambient Graphic) -->
  <g id="radarGroup">
    <!-- Radar Base Circles -->
    <circle cx="980" cy="210" r="160" fill="none" stroke="#00f0ff" stroke-opacity="0.1" stroke-width="1" />
    <circle cx="980" cy="210" r="120" fill="none" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1" class="radar-pulse" />
    <circle cx="980" cy="210" r="80" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="980" cy="210" r="40" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />

    <!-- Crosshairs -->
    <line x1="800" y1="210" x2="1160" y2="210" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="980" y1="30" x2="980" y2="390" stroke="#00f0ff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Degree markers -->
    <text x="980" y="25" fill="#00f0ff" opacity="0.4" font-size="10" text-anchor="middle" class="font-mono">000°</text>
    <text x="1165" y="214" fill="#00f0ff" opacity="0.4" font-size="10" text-anchor="start" class="font-mono">090°</text>
    <text x="980" y="405" fill="#00f0ff" opacity="0.4" font-size="10" text-anchor="middle" class="font-mono">180°</text>
    <text x="795" y="214" fill="#00f0ff" opacity="0.4" font-size="10" text-anchor="end" class="font-mono">270°</text>

    <!-- Radar Sweep Wedge -->
    <g class="radar-sweep">
      <path d="M 980 210 L 980 50 A 160 160 0 0 1 1130 155 Z" fill="url(#radarSweepGrad)" />
      <line x1="980" y1="210" x2="1130" y2="155" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Targets Detected on Radar -->
    <g class="target-1">
      <circle cx="920" cy="140" r="4" fill="#00f0ff" filter="url(#strongGlow)" />
      <circle cx="920" cy="140" r="10" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5" />
      <text x="930" y="135" fill="#38bdf8" font-size="9" font-weight="bold" class="font-mono">[TARGET 01]</text>
    </g>
    <g class="target-2">
      <circle cx="1040" cy="270" r="4" fill="#8b5cf6" filter="url(#strongGlow)" />
      <circle cx="1040" cy="270" r="8" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
      <text x="1050" y="275" fill="#a78bfa" font-size="9" font-weight="bold" class="font-mono">[IDENTITY MATCH]</text>
    </g>
    <g class="target-3">
      <circle cx="960" cy="290" r="3" fill="#10b981" filter="url(#strongGlow)" />
      <text x="970" y="295" fill="#34d399" font-size="8" class="font-mono">[BREACH HIT]</text>
    </g>
  </g>

  <!-- Ambient Floating Particles -->
  <circle cx="80" cy="90" r="3" fill="#00f0ff" class="particle-1" />
  <circle cx="190" cy="140" r="2.5" fill="#3b82f6" class="particle-2" />
  <circle cx="260" cy="80" r="2" fill="#8b5cf6" class="particle-3" />
  <circle cx="580" cy="90" r="3" fill="#38bdf8" class="particle-2" />
  <circle cx="480" cy="350" r="2" fill="#00f0ff" class="particle-1" />

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Chip / Pill -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="310" height="30" rx="15" fill="url(#pillGrad)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="15" cy="15" r="4" fill="#00f0ff" filter="url(#glow)" />
    <text x="28" y="19" fill="#38bdf8" font-size="11" font-weight="bold" letter-spacing="1.5" class="font-mono">
      INTEL ECOSYSTEM // RECON 2026
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 135)">
    <!-- Subtle drop shadow text for extreme readability -->
    <text x="2" y="2" fill="#030712" font-size="44" font-weight="900" class="font-sans" letter-spacing="-0.5">
      Awesome OSINT Ecosystem
    </text>
    <text x="0" y="0" fill="url(#titleGrad)" font-size="44" font-weight="900" class="font-sans" letter-spacing="-0.5" filter="url(#glow)">
      Awesome OSINT Ecosystem
    </text>
  </g>

  <!-- Subtitle Line 1 -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" fill="#94a3b8" font-size="18" font-weight="500" class="font-sans">
      Open Source Intelligence &amp; Digital Investigation Directory
    </text>
  </g>

  <!-- Subtitle Line 2 - Core capabilities highlight -->
  <g transform="translate(60, 215)">
    <text x="0" y="0" fill="#cbd5e1" font-size="14" class="font-sans">
      Curated index of commercial SaaS platforms &amp; high-performance open-source GitHub projects.
    </text>
    <text x="0" y="24" fill="#64748b" font-size="13" class="font-sans">
      Covering username &amp; email enumeration, graph analysis, breach correlation, facial search &amp; threat intelligence.
    </text>
  </g>

  <!-- Feature Tags / Metric Pills -->
  <g transform="translate(60, 290)">
    <!-- Pill 1: Identity Resolution -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="21" fill="#38bdf8" font-size="11" font-weight="600" class="font-mono">🔍 IDENTITY LOOKUP</text>
    </g>

    <!-- Pill 2: Threat Intelligence -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="21" fill="#818cf8" font-size="11" font-weight="600" class="font-mono">🛡️ THREAT INTEL</text>
    </g>

    <!-- Pill 3: Graph Link Analysis -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="21" fill="#a78bfa" font-size="11" font-weight="600" class="font-mono">🕸️ LINK ANALYSIS</text>
    </g>

    <!-- Pill 4: Breach & Footprints -->
    <g transform="translate(525, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="21" fill="#34d399" font-size="11" font-weight="600" class="font-mono">⚡ BREACH CORRELATION</text>
    </g>
  </g>

  <!-- Bottom Terminal Style Status Strip -->
  <g transform="translate(60, 368)">
    <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#glow)" />
    <text x="20" y="10" fill="#10b981" font-size="11" font-weight="600" class="font-mono">STATUS: ACTIVE &amp; COMMUNITY CURATED</text>
    <text x="360" y="10" fill="#64748b" font-size="11" class="font-mono">|</text>
    <text x="380" y="10" fill="#94a3b8" font-size="11" class="font-mono">UPDATED: 2026</text>
    <text x="490" y="10" fill="#64748b" font-size="11" class="font-mono">|</text>
    <text x="510" y="10" fill="#94a3b8" font-size="11" class="font-mono">VERIFIED DATASETS &amp; API FEEDS</text>
  </g>

  <!-- Outer Card Glowing Border -->
  <rect x="4" y="4" width="1192" height="412" rx="20" fill="none" stroke="url(#cyberBorder)" stroke-width="2" class="card-border" />
</svg>